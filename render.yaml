# render.yaml — Render Blueprint for the flexlayout-dash documentation site.
# Deploys run.py as a Docker web service, fronted by
# https://flexlayout.2plot.dev.
# Blueprint spec: https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Push this repo (with Dockerfile + render.yaml) to GitHub.
#   2. Render dashboard -> New -> Blueprint -> select this repo.
#   3. Render builds the Dockerfile and serves run:server with gunicorn.
#   4. Settings -> Custom Domains -> add `flexlayout.2plot.dev`, then create
#      the CNAME Render shows you on the 2plot.dev zone:
#        flexlayout  CNAME  <service>.onrender.com
#   5. Set CROSS_APP_WEBHOOK_SECRET in the dashboard (sync: false below) if you
#      want this app reporting traffic to 2plot.ai. Everything else has a value
#      here and needs no manual step.
#
# Local equivalent (no Render needed):
#   docker build -t flexlayout-dash-docs .
#   docker run --rm -p 8055:8055 -e PORT=8055 flexlayout-dash-docs
#   open http://localhost:8055
services:
  - type: web
    name: flexlayout-dash-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter (the network reference shape, 2026-08): free sleeps after
    # ~15 min idle, cold-starts on the next request, and was measured dark
    # (503) on the 2026-08-13 network sweep. Starter also permits the
    # persistent disk below, which is what makes the analytics ledger
    # survive deploys. The owner upgraded the live dashboard 2026-08-16;
    # this file matches it.
    plan: starter
    # /healthz is the 2plot network convention (lib/health.py) and is excluded
    # from traffic counts, so it makes a cleaner check than /.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- Core --------------------------------------------------------
      # gunicorn worker processes. 2 is a reasonable default; drop to 1 if the
      # free tier's 512 MB feels tight. The Dockerfile also runs 4 threads per
      # worker for callback concurrency.
      - key: WEB_CONCURRENCY
        value: "2"
      # Public origin for canonical URLs, sitemap.xml and llms.txt. Must match
      # app._base_url in run.py, which the prerender uses for canonical tags.
      # BOTH names are set on purpose (network standard, "Found on the email
      # pass" §4): APP_BASE_URL is the shared spelling every host's scripts/
      # and tests/ read; FLEXLAYOUT_BASE_URL is this repo's legacy alias.
      # lib/constants.py accepts APP_BASE_URL first. Removing one of two env
      # names on a live service is how a satellite deindexes itself — keep
      # both.
      - key: APP_BASE_URL
        value: https://flexlayout.2plot.dev
      - key: FLEXLAYOUT_BASE_URL
        value: https://flexlayout.2plot.dev

      # The hub's announcement feed, rendered in this site's llms.txt viewer
      # header. Opt-in — unset means the feature is simply off (lib/bulletin).
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin

      # --- 2plot.dev ad network (lib/ad_client.py) ---------------------
      # Without AD_SERVER_URL reachable the slot simply stays hidden, and a
      # 60s circuit breaker stops retrying, so an outage never slows a page.
      - key: AD_SERVER_URL
        value: https://2plot.dev
      # This app's identity in the ad network's /admin/ad-board tables.
      # The SHORT directory key (hub 2.2.0 rule) — the same id as
      # SATELLITE_APP_KEY and the bulletin app_id. This carried the legacy
      # "flexlayout-dash" spelling until 2026-08-01; the hub folds legacy ids
      # at ingest, but new builds must send the canonical one.
      - key: AD_APP_ID
        value: flexlayout

      # --- 2plot.ai satellite analytics --------------------------------
      # lib/analytics_tracker.py -> lib/traffic_rollup.py
      #                          -> lib/satellite_reporter.py
      #
      # The shared HMAC secret every satellite holds. Set it in the Render
      # dashboard (same value as on 2plot.ai) — never in this file.
      # Without it the app still serves /healthz but reports nothing.
      #   Hub side, to health-sweep this app hourly, add to 2plot.ai:
      #   PULSE_POLL_TARGETS=...,flexlayout=https://flexlayout.2plot.dev/healthz
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # The series name this app reports under on 2plot.ai/traffic.
      # "flexlayout" is this app's 2plot network-directory key — the hub labels
      # and colours the series from that directory.
      #
      # NOTE the variable name: SATELLITE_APP_KEY, not the SATELLITE_APP_ID the
      # pre-hub-client generation used. lib/satellite_reporter.py reads the new
      # name; the old one is inert.
      #
      # NO LONGER BELT-AND-BRACES. lib/satellite_reporter.py is now
      # BYTE-IDENTICAL to the boilerplate's, which means its own fallback says
      # "boilerplate" — it used to be edited to say "flexlayout", and that edit
      # is what made the file a fork nobody could re-sync. The identity claim
      # moved to run.py's marked FORK POINT
      # (`os.environ.setdefault("SATELLITE_APP_KEY", "flexlayout")`, before any
      # hub-facing import), and this row is the real env value that wins over
      # it. Between the two there is no path on which this app's traffic files
      # under the template's hub row.
      - key: SATELLITE_APP_KEY
        value: flexlayout
      # Minimum seconds between rollup POSTs. 900 is the network standard;
      # this host carried 1800 from the free-tier era (it halved what an
      # eviction could swallow) and no longer needs to — the disk below keeps
      # the ledger, and the hub takes the LAST report for a given (app, date).
      #
      # This paces the DAILY ROLLUP only. Presence is a separate, lighter
      # thread (SATELLITE_PRESENCE_INTERVAL_S, default 60s, floor 30, 0
      # disables) that posts {app, active} to /api/satellite/active so the
      # hub's board can show who is on this satellite right now. Left unset:
      # the default is the contract.
      - key: SATELLITE_REPORT_INTERVAL_S
        value: "900"

      # The hub takes the LAST report for a given (app, date). On an
      # ephemeral filesystem a mid-day deploy wipes the ledger and the next
      # hourly report overwrites the day's real total with whatever accrued
      # since the restart. The disk below is what stops that.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json

      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default here so every fork SEES the knob: the 402 experiment
      # tightens the full corpus by flipping this to `auth`, per satellite,
      # with no code change. On THIS site tiers are recorded, not enforced
      # (no access control is wired) — see run.py. Values in .env.example.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public

      # --- The interactive gate (lib/gate_layouts.py) ---------------------
      # SHIPPED DARK. THE per-host gate switch: flip to `auth` and every docs
      # page whose frontmatter doesn't pin a tier shows the sign-in card to
      # anonymous browsers. Rollback is flipping it back — env only, no code
      # revert anywhere.
      #
      # Declared EXPLICITLY at its default rather than left unset, for two
      # reasons: the knob is visible here instead of being folklore, and
      # run.py keys `access.configure(force=...)` off its presence — so the
      # verdict plumbing (and the prerender's use of it) is live and
      # verifiable during the dark launch instead of first switching on at
      # the flip. Enforcement is proven BEFORE the flip, never after.
      #
      # Funnel pages never inherit it: `/` is pinned public in run.py, and so
      # are the corpus pseudo-paths above.
      - key: PAGE_DEFAULT_TIER
        value: public
      # The second axis, and the phase-4 agent flip: while "1", machine
      # surfaces (the llms.txt family, crawler HTML, the prerender) stay open
      # on auth pages so the crawl-demand window keeps measuring. "0" gates
      # anonymous machine fetches too (keyed agents still pass). Do not flip
      # before the window closes.
      - key: LLMS_PUBLIC_DEFAULT
        value: "1"

      # Control-board overrides (/admin/control-board) persist here — on the
      # same disk as the ledger, so toggles survive deploys. TWICE on the
      # pilot host this row rode render.yaml without reaching the live
      # service (Blueprint env applies only on a sync) and every toggle
      # silently reset per deploy; the boot now prints a `[visibility]`
      # WARNING when the variable is missing OR when /var/data is not
      # actually a mounted disk. The ABSENCE of that warning in a deploy log
      # is the acceptance check.
      - key: PAGE_VISIBILITY_FILE
        value: /var/data/page_visibility.json

      # --- Clerk satellite auth (lib/auth.py) -----------------------------
      # All OPTIONAL: absent, the site runs fully public and admin surfaces
      # fail CLOSED (lib.auth.admin_access_open). The package itself is
      # VENDORED (vendor/dash_clerk_auth-1.0.5.tar.gz) and installed in every
      # image whether or not these keys are set — it registers a Dash
      # entry-point hook, so it is imported at app construction regardless,
      # which is why requirements.txt also floors clerk-backend-api and
      # cryptography.
      #
      # Several of the values below are ALSO delivered by the shared env
      # group `2plot-clerk-satellite`; a group and this file setting the same
      # key is harmless (same value), and both are kept so the shape of a
      # gating host is readable from the repo alone.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # The 2plot.ai PRIMARY on its production Clerk instance (Account Portal
      # + Frontend API custom domains — not *.accounts.dev).
      - key: CLERK_SIGN_IN_URL
        value: https://accounts.2plot.ai/sign-in
      - key: CLERK_SIGN_UP_URL
        value: https://accounts.2plot.ai/sign-up
      # THE RETURN TRIP — the stage-5 blocker the leaflet pilot surfaced.
      # Unset, buildSatelliteRedirect() returns null, every sign-in path falls
      # through to the Clerk Account Portal, the hub's return machinery never
      # runs, and the user authenticates successfully and STAYS on the
      # primary — no error anywhere. A DESTINATION, not a flag: the value is
      # concatenated as `<value>?returnTo=<here>`, so `true` or a bare host
      # resolves against THIS site and the button 404s — worse than unset.
      # lib/auth.py warns at boot for both mistakes; the absence of those
      # warnings is the deploy acceptance check.
      - key: CLERK_SATELLITE_SIGN_IN_REDIRECT
        value: https://2plot.ai/onboarding
      # REQUIRED in satellite mode; a production custom-domain instance
      # cannot derive it from CLERK_SIGN_IN_URL.
      - key: CLERK_FRONTEND_API
        value: https://clerk.2plot.ai
      # The REGISTERED SATELLITE DOMAIN — deliberately NOT the host this app
      # is served on. Every *.2plot.dev docs host is an ALLOWED SUBDOMAIN of
      # the 2plot.dev satellite; clerk.flexlayout.2plot.dev is NXDOMAIN and
      # setting it here hangs sign-in. Session cookies are scoped to
      # .2plot.dev, which is exactly what the allowlist enables.
      - key: CLERK_SATELLITE_DOMAIN
        value: 2plot.dev
      - key: CLERK_IS_SATELLITE
        value: "true"
      # Signs the session + __dca_identity cookies. MUST be unique per
      # service — without it dash-clerk-auth falls back to a PUBLIC dev
      # default string.
      - key: SESSION_SECRET
        generateValue: true
      # Admin allowlist for admin-tier surfaces (lib.auth.is_admin_user),
      # including /admin/control-board.
      - key: ADMIN_EMAILS
        sync: false

      # --- Values delivered by shared env groups --------------------------
      # Link these three in the Render dashboard; they carry the values that
      # must not be typed twice across the fleet:
      #
      #   2plot-network-shared     the CROSS_APP_WEBHOOK_SECRET above
      #   2plot-satellite-reporting  reporting cadence + BOTH /var/data paths
      #   2plot-clerk-satellite    the full Clerk block above
      #
      # Group linkage cannot be verified from inside this repo. The boot
      # guards are the check: no `[visibility]` warning and no `[auth]`
      # warning in the deploy log means both landed.

    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
