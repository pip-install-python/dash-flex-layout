name: Release

# Tag-driven publish. Push a v* tag and this builds, verifies, publishes to
# PyPI via OIDC trusted publishing, and opens a GitHub Release.
#
# NO API TOKEN IS STORED ANYWHERE. Trusted publishing has PyPI verify a
# short-lived OIDC token minted by GitHub for this specific repo + workflow +
# environment, so there is no long-lived secret to leak or rotate.
#
# ONE-TIME SETUP ON PyPI. flexlayout-dash 1.0.0 is ALREADY PUBLISHED, so this
# is NOT a "pending publisher" (that flow is for projects that do not exist
# yet). Add the publisher to the existing project:
#   pypi.org -> Your projects -> flexlayout-dash -> Manage -> Publishing
#     -> Add a new publisher (GitHub)
#     Owner:            pip-install-python
#     Repository:       dash-flex-layout
#     Workflow name:    release.yml
#     Environment name: pypi
#
# The Repository field must be the repo's CANONICAL GitHub name. A renamed repo
# still redirects for `git push`, but the OIDC claim carries the NEW name and
# PyPI matches it exactly — a mismatch fails as `invalid-publisher` only after
# the whole matrix has passed. Verified 2026-07-31 via the GitHub API:
# full_name = pip-install-python/dash-flex-layout.
#
# The version lives in pyproject.toml. package.json must match it (
# dash-generate-components copies package.json's version into
# flexlayout_dash/package-info.json, which is what flexlayout_dash.__version__
# returns at runtime). scripts/check_release.py enforces all four places.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match the version in pyproject.toml
        # Catches the classic release mistake: bumping the code but tagging the
        # old number (or the reverse). PyPI would happily accept the mismatch.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VER=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "tag=$TAG  pyproject=$PY_VER"
          if [ "$TAG" != "$PY_VER" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PY_VER"
            exit 1
          fi

      - name: CHANGELOG must have an entry for this version
        # Releasing without saying what changed. The github-release job below
        # extracts this same section for the release body, so an absent entry
        # would also produce an empty release note.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "found CHANGELOG entry for $VERSION"

      - name: Release consistency check
        run: python scripts/check_release.py

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Smoke test against the current Dash
        # Two-command install, same as the Dockerfile and ci.yml: markdown2dash
        # 0.1.2 declares gunicorn<22 against the CVE-driven >=23 floor in
        # requirements.txt, so it is absent there and installs with --no-deps.
        # This step was the one place that missed the dance — release.yml first
        # ran at v2.0.0, after the dodge landed everywhere else, and the fresh
        # runner failed on the missing import.
        run: |
          python -m pip install --upgrade pip
          grep -v 'COMPAT-MATRIX: dash' requirements.txt > /tmp/reqs.txt
          python -m pip install dash -r /tmp/reqs.txt
          python -m pip install --no-deps markdown2dash==0.1.2
          python scripts/smoke_test.py

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the pending publisher configured on PyPI.
    # Add a required reviewer on this environment in repo settings if you want
    # a human approval gate between the tag and the upload.
    environment:
      name: pypi
      url: https://pypi.org/p/flexlayout-dash
    permissions:
      # `id-token: write` is what lets GitHub mint the OIDC token PyPI checks.
      # Without it trusted publishing fails with an opaque 403.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (manual dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract this version's CHANGELOG section
        # Matches a `## [1.2.0]` heading and takes everything up to the next
        # `## [`. Falls back to a pointer if the section is absent, so a
        # missing entry never blocks a release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
