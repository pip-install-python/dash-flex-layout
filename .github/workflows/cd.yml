name: CD

# Deploys flexlayout.2plot.dev, then checks the live site.
#
# THE ROAD (item 13, 2026-08-29): Render auto-deploys the `release` branch,
# and ONLY this workflow writes `release` — a fast-forward push of the run's
# own sha, after the CI matrix is green. A push to `main` is therefore not a
# deploy; it is a candidate. This closes the class of failure where Render
# watches the same branch CI is still judging: a push that goes red in CI can
# no longer reach the wire, because nothing deploys `main` any more.
#
# The Render deploy-hook step is GONE from this file; the repository secret
# it read (the deploy-hook URL secret) is inert and safe to delete. `main`
# ahead of `release` means an uncertified push is pending (its run red or
# running) — never "drift", never a reason to deploy by hand (kit trap).
#
# (PyPI publishing is NOT here — release.yml owns that, tag-driven.)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://flexlayout.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the wait loop below (up to 100 × 15s = 25 minutes, which
    # has to cover Render's queue + build + swap) and no longer. Without it the
    # job inherits GitHub's six-hour default, which is how a platform that
    # never comes back healthy holds the `cd-production` concurrency group all
    # day.
    #
    # Sized for the WORST build, not the median (template 1.6.13/1.6.16): a
    # floor bump busts the Docker dependency cache by design, so this
    # pipeline's most important deploy is also Render's slowest — dash-email's
    # wait timed out on exactly that build class (2026-08-23) with the old
    # 60 × 15s window.
    timeout-minutes: 30
    environment:
      name: production
      url: https://flexlayout.2plot.dev
    # `contents: write` on THIS job only — it is the one thing in the
    # workflow that writes to the repository (the `release` ref). The
    # workflow-level grant above stays `read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # FULL history, not the default depth-1 shallow clone. A shallow
          # HEAD pushed onto an EXISTING `release` is rejected as
          # non-fast-forward ("fetch first") because the clone cannot show
          # the remote that release's tip is an ancestor. The first promote
          # succeeds regardless — it creates the branch — so this only bites
          # the SECOND push onto an established release.
          # tests/test_cd_promotes_release.py pins it.
          fetch-depth: 0

      - name: Promote to release
        # Only a push to main promotes. A workflow_dispatch that names
        # another host (target_url) is a verify-only run against that host
        # and must not move this repo's release ref.
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # Fast-forward push of the run's own sha. `needs: [test]` is the
          # gate: a red matrix never reaches this step, so `release` cannot
          # receive an uncertified commit by construction. On the FIRST run
          # `release` does not exist yet and this push creates it.
          #
          # NOT --force, on purpose: a non-fast-forward means somebody wrote
          # `release` by hand (a rollback, a hotfix). This job then FAILS
          # and says so; a force here would silently undo that person.
          #
          # GITHUB_TOKEN pushes trigger no workflows — correct: `on:` is
          # main-only, and it is Render, not Actions, that reacts to
          # `release` (render.yaml `branch: release`, autoDeploy on).
          git push origin "HEAD:refs/heads/release"
          echo "::notice::release → ${GITHUB_SHA} (fast-forward)"

      - name: Wait for THIS build to serve traffic
        # Render deploys `release`, which the promote step above just set
        # to this run's sha, so the wait is unchanged: hold until /healthz
        # reports THIS build. Skipping this wait is what made an earlier
        # shape of this workflow verify the previous release on every run —
        # the previous release always already passed the previous battery,
        # so the defect only showed when a run added a new surface. Found
        # on muicharts 2026-08-21, fleet-wide class.
        run: |
          # A bare 200 proves nothing about WHICH build answered: a service
          # with a disk restarts with a blip rather than overlapping
          # instances, and the old build answers /healthz right up to the
          # swap. /healthz now reports the running instance's commit
          # (RENDER_GIT_COMMIT, lib/health.py), and this loop holds until it
          # equals the SHA that triggered this run.
          #
          # Fallback: a build predating the field gets the old
          # sustained-health wait, with a warning naming exactly what it
          # cannot tell. That fallback fires ONCE — on the deploy that
          # carries the field for the first time, i.e. this one.
          want="${GITHUB_SHA}"
          matched=0
          ok=0
          for _ in $(seq 1 100); do
            body="$(curl -fsS "$SITE_URL/healthz" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              build="$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
              if [ "$build" = "$want" ]; then
                matched=$((matched + 1))
                [ "$matched" -ge 3 ] && break
              elif [ -z "$build" ]; then
                ok=$((ok + 1))
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ge 3 ]; then
            echo "::notice::live /healthz reports build $want — verifying the artifact this run shipped."
          elif [ "$ok" -ge 5 ]; then
            echo "::warning::live /healthz predates the build field — cannot prove WHICH build is serving; verified sustained health only. This warning should appear exactly once."
          else
            echo "::error::$SITE_URL never served this run's build ($want) and never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    # ONLY after a successful deploy (item 13 fix-forward): the old
    # `!= 'cancelled' && != 'skipped'` admitted `failure` too, so when the
    # promote step failed this job ran anyway and reported GREEN — it had
    # smoke-tested the PREVIOUS build. A verify that passes when nothing
    # deployed must not exist.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Site lane — tracks the Dockerfile's FROM minor, same as ci.yml's
          # site-tests job (SYNC-1.6.22-1.6.29 item 5).
          python-version: "3.14"

      - name: The live build IS this run's sha
        # Belt to the `if:` above's braces, and stronger: it also catches a
        # promote that succeeded while Render's build did not, or a later
        # run that promoted past us between deploy and verify. Skipped on a
        # workflow_dispatch against another host (its shas are not ours).
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          build="$(curl -fsS "$SITE_URL/healthz" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))')"
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "::error::verify refuses: $SITE_URL serves build '${build:-<none>}', this run is $GITHUB_SHA — nothing this run shipped is on the wire to verify"
            exit 1
          fi
          echo "::notice::verifying build $build (this run's sha)"

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the social card's real pixels on the
      # CDN, and every peer llms.txt in the directory actually resolving.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a blank or misshapen social card, a missing network directory, and dead peer llms.txt links."
